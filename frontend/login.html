<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ТрудПраво — Вход</title>
  <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=PT+Serif:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .auth-container {
      display: flex;
      width: 100%;
      max-width: 960px;
      min-height: 560px;
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(30, 58, 138, 0.1);
      margin: 20px;
    }
    .auth-brand {
      width: 400px;
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      color: white;
      padding: 48px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      flex-shrink: 0;
    }
    .auth-brand .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 30px;
    }
    .auth-brand h2 {
      font-family: 'PT Serif', serif;
      font-size: 26px;
      margin-bottom: 12px;
    }
    .auth-brand p {
      font-size: 14px;
      line-height: 1.6;
      color: rgba(255,255,255,0.85);
      margin-bottom: 24px;
    }
    .stat-card {
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 10px;
    }
    .stat-number {
      font-family: 'PT Serif', serif;
      font-size: 24px;
      font-weight: 700;
      color: #93C5FD;
    }
    .stat-label {
      font-size: 12px;
      color: rgba(255,255,255,0.85);
    }
    .auth-form-panel {
      flex: 1;
      padding: 48px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .auth-form-panel h1 {
      font-family: 'PT Serif', serif;
      font-size: 26px;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 14px;
      color: var(--text-light);
      margin-bottom: 24px;
    }
    .subtitle a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
    }
    .form-input:focus {
      border-color: var(--primary);
    }
    .submit-btn {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }
    .submit-btn:hover {
      background: var(--primary-dark);
    }
    .back-link {
      display: inline-block;
      margin-top: 16px;
      color: var(--text-light);
      text-decoration: none;
      font-size: 13px;
      text-align: center;
      width: 100%;
    }
    .back-link:hover {
      color: var(--primary);
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="auth-brand">
      <a href="/" class="logo">
        <div class="logo-icon">⚖️</div>
        <div class="logo-text">Труд<span>Право</span></div>
      </a>
      <h2>С возвращением!</h2>
      <p>Войдите для доступа к расширенным консультациям по Трудовому кодексу РК.</p>

      <div class="stat-card">
        <div class="stat-number">1500+</div>
        <div class="stat-label">Чанков и статей ТК РК в базе</div>
      </div>
      <div class="stat-card">
        <div class="stat-number">AI</div>
        <div class="stat-label">Поиск с точными цитатами [S1]</div>
      </div>
    </div>

    <div class="auth-form-panel">
      <h1>Вход в систему</h1>
      <p class="subtitle">Нет аккаунта? <a href="/register">Зарегистрироваться</a></p>

      <form onsubmit="event.preventDefault(); window.location.href='/';">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" placeholder="user@example.kz" required>
        </div>

        <div class="form-group">
          <label class="form-label">Пароль</label>
          <input type="password" class="form-input" placeholder="••••••••" required>
        </div>

        <button type="submit" class="submit-btn">Войти</button>
      </form>

      <a href="/" class="back-link">← Вернуться в чат без входа</a>
    </div>
  </div>

</body>
</html>
